name: Windows EXE Smoke Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build. Leave empty for the selected branch."
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "mkv_creator_ui.py"
      - "build_windows_exe.py"
      - "G-TMCE.spec"
      - "requirements.txt"
      - "requirements-build.txt"
      - "VERSION"
      - "logo.png"
      - "mkv.mtxcfg"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build EXE
        run: python build_windows_exe.py

      - name: Prepare artifact name
        shell: pwsh
        run: |
          $version = (Get-Content VERSION | Select-Object -First 1).Trim()
          if (-not $version) { $version = 'manual' }
          $exeName = "G-TMCE-${version}-win-x64.exe"
          Move-Item -Force "dist/G-TMCE.exe" "dist/$exeName"
          "EXE_NAME=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXE_NAME }}
          path: dist/${{ env.EXE_NAME }}
          if-no-files-found: error
