name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build. Leave empty for the selected branch."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build EXE
        run: python build_windows_exe.py

      - name: Prepare artifact name
        shell: pwsh
        run: |
          $version = (Get-Content VERSION | Select-Object -First 1).Trim()
          if (-not $version) { $version = 'manual' }
          $exeName = "G-TMCE_${version}_win-x64.exe"
          Move-Item -Force "dist/G-TMCE.exe" "dist/$exeName"
          "EXE_NAME=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXE_NAME }}
          path: dist/${{ env.EXE_NAME }}
          if-no-files-found: error
